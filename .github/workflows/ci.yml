name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x, 26.x]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm audit --audit-level=high
    - run: npm run build
    - run: npm run typecheck:web
    - run: npm run eval
    - run: npm run eval:fixture
    - run: npm run fixture:web
    - name: Fixtures are up to date
      run: git diff --exit-code -- eval/fixtures/rogue-agent.json web/public/fixtures/demo.json
    - run: npm run build:web
    - name: Install Playwright browser
      if: runner.os == 'Linux' && matrix.node-version == '24.x'
      run: npx playwright install --with-deps chromium
    - name: Accessibility scan
      if: runner.os == 'Linux' && matrix.node-version == '24.x'
      run: npm run test:a11y
    - run: npm run build:esm
    - run: npm run check:package
    - run: npm test
    - run: npm run lint
    - name: Python SDK tests
      if: runner.os == 'Linux'
      run: python -m unittest discover -s python -p 'test_*.py'
    - name: End-to-end process checks
      if: runner.os == 'Linux' && matrix.node-version == '24.x'
      run: npm run e2e
