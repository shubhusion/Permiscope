name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          VERSION=$(npm --version)
          echo "npm version: $VERSION"
          if [ "$(printf '%s\n' 11.5.1 "$VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "Upgrading npm for OIDC trusted publishing"
            npm install -g npm@latest
          fi
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run build:esm
      - run: npm run typecheck:web
      - run: npm run build:web
      - run: npm run check:package
      - run: npm test
      - run: npm run lint
      - run: npm run eval
      - run: npm run e2e
      - run: npm run smoke:package
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./package.json').version")
          test "$TAG" = "$VERSION" || { echo "Tag $TAG != package version $VERSION"; exit 1; }
      # Authentication is OIDC via npm Trusted Publishing: no token, no TTY,
      # no 2FA prompt. The publisher is scoped to shubhusion/Permiscope:release.yml.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
