name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run fixture:web
      - run: npm run build:web
        env:
          VITE_BASE: ./
          VITE_DEMO_MODE: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed site
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          curl --retry 8 --retry-delay 5 --retry-all-errors -fsS "$URL" -o /tmp/index.html
          grep -q './assets/' /tmp/index.html
          curl --retry 8 --retry-delay 5 --retry-all-errors -fsS "$URL/fixtures/demo.json" > /dev/null
